<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0ea5e9">
  <title>みずログ - 水分管理</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>💧 みずログ</h1>
      <div class="header-actions">
        <button id="installBtn" class="install-btn" hidden>⬇️ インストール</button>
        <button id="settingsBtn" class="icon-btn" aria-label="設定">⚙️</button>
      </div>
    </header>

    <!-- メインのグラス表示 -->
    <section class="glass-section">
      <div class="glass" id="glass" role="img" aria-label="今日の水分摂取グラフ">
        <div class="glass-water" id="glassWater">
          <div class="wave"></div>
        </div>
        <div class="glass-label">
          <div class="glass-current" id="glassCurrent">0</div>
          <div class="glass-unit">ml</div>
          <div class="glass-goal" id="glassGoal">/ 2000 ml</div>
        </div>
      </div>
      <div class="percent" id="percent" aria-live="polite">0%</div>
      <div class="remaining" id="remaining" aria-live="polite">目標まであと 2000 ml</div>
    </section>

    <!-- クイック追加ボタン（量は設定で変更可・JSで描画） -->
    <section class="quick-add" id="quickAdd">
      <button class="add-btn preset" data-amount="200"></button>
      <button class="add-btn preset" data-amount="350"></button>
      <button class="add-btn preset" data-amount="500"></button>
      <button class="add-btn" id="customBtn"><span class="add-emoji">✏️</span><span class="add-ml">自由</span><span class="add-name">入力</span></button>
    </section>

    <button id="undoBtn" class="undo-btn" hidden>↩︎ 直前の記録を取り消す</button>

    <!-- 週間履歴 -->
    <section class="history">
      <div class="history-head">
        <h2>この1週間</h2>
        <span id="weekAvg" class="week-avg"></span>
      </div>
      <div class="chart" id="chart"></div>
    </section>

    <!-- 今日の記録リスト -->
    <section class="log">
      <h2>今日の記録</h2>
      <ul id="logList" class="log-list"></ul>
      <p id="logEmpty" class="log-empty">まだ記録がありません。上のボタンから追加しましょう。</p>
    </section>
  </div>

  <!-- 設定モーダル -->
  <div class="modal" id="settingsModal" hidden>
    <div class="modal-card">
      <h2>設定</h2>
      <label class="field">
        <span>1日の目標量 (ml)</span>
        <input type="number" id="goalInput" min="200" max="6000" step="100" inputmode="numeric">
      </label>
      <div class="preset-goals">
        <button data-goal="1500">1500</button>
        <button data-goal="2000">2000</button>
        <button data-goal="2500">2500</button>
        <button data-goal="3000">3000</button>
      </div>
      <div class="setting-row">
        <div>
          <div class="setting-title">飲水リマインダー</div>
          <div class="setting-note">アプリを開いている間、一定間隔で通知します</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="reminderToggle">
          <span class="slider"></span>
        </label>
      </div>
      <label class="field" id="reminderIntervalField">
        <span>通知の間隔</span>
        <select id="reminderInterval">
          <option value="30">30分ごと</option>
          <option value="60">1時間ごと</option>
          <option value="120" selected>2時間ごと</option>
          <option value="180">3時間ごと</option>
        </select>
      </label>
      <p class="setting-note">最後に飲んでからこの時間が経つと通知します（アプリを開いている間のみ）。</p>

      <div class="setting-row">
        <div class="setting-title">クイックボタンの量 (ml)</div>
      </div>
      <div class="preset-edit">
        <input type="number" id="presetInput0" min="10" max="3000" step="10" inputmode="numeric" aria-label="ボタン1の量">
        <input type="number" id="presetInput1" min="10" max="3000" step="10" inputmode="numeric" aria-label="ボタン2の量">
        <input type="number" id="presetInput2" min="10" max="3000" step="10" inputmode="numeric" aria-label="ボタン3の量">
      </div>

      <div class="modal-actions">
        <button id="settingsSave" class="primary">保存</button>
        <button id="settingsClose" class="ghost">閉じる</button>
      </div>

      <div class="data-actions">
        <button id="exportBtn" class="link-btn">📄 CSVで書き出す</button>
        <button id="backupBtn" class="link-btn">💾 バックアップ(JSON)</button>
        <button id="restoreBtn" class="link-btn">📥 バックアップから復元</button>
      </div>
      <input type="file" id="restoreFile" accept="application/json,.json" hidden>
      <button id="resetToday" class="danger-link">今日の記録をすべて消す</button>
    </div>
  </div>

  <!-- カスタム入力モーダル -->
  <div class="modal" id="customModal" hidden>
    <div class="modal-card">
      <h2>飲んだ量を入力</h2>
      <label class="field">
        <span>量 (ml)</span>
        <input type="number" id="customInput" min="1" max="3000" step="10" inputmode="numeric" placeholder="例: 180">
      </label>
      <div class="modal-actions">
        <button id="customSave" class="primary">追加</button>
        <button id="customClose" class="ghost">キャンセル</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/app.js"></script>
</body>
</html>
